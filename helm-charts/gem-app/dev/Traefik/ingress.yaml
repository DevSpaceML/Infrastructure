{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-strip-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - "/{{ required "projectname is required" .Values.projectname }}/{{ .Release.Name }}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: "Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`/{{ .Values.projectname }}/{{ .Release.Name }}`)"
      middlewares:
        - name: {{ .Release.Name }}-strip-prefix
      services:
        - name: {{ .Release.Name }}-service
          port: {{ .Values.app.port }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Release.Name }}-tls
  {{- end }}
{{- end }}
---
# Binds to AWS TargetGroup via targetGroupArn and securityGroupID
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: traefik
  namespace: traefik
spec:
  serviceRef: { name: traefik, port: 80 }
  targetGroupARN: {{ required "targetGroupBinding.targetGroupARN is required" .Values.targetGroupBinding.targetGroupArn | quote }}
  targetType: ip
  networking:
    ingress:
      - from:
          - securityGroup: { groupID: {{ required "targetGroupBinding.securityGroupID is required" .Values.targetGroupBinding.securityGroupId | quote }} }
        ports:
          - { protocol: TCP, port: 80 }
          - { protocol: TCP, port: 8080 }   # health check port