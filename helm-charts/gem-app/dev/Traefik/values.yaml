# TRAEFIK values.yaml
deployment:
  replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

service:
  type: ClusterIP

ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    expose:
      default: false

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

ingressRoute:
  enabled: true
  entryPoints: [web]
  host: project.salientapps.com
  tls:
    enabled: false

additionalArguments:
  - "--entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8"

logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json