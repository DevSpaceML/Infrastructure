# Prometheus agent yaml file. Installs to every ephemeral cluster
# Service Account, ClusterRole and ClusterRoleBinding created in Terraform

apiVersion: monitoring.coreos.com/v1alpha1
kind: PrometheusAgent
metadata:
  name: agent
  namespace: monitoring
spec:
  replicas: 1
  serviceAccountName: prometheus-agent
  scrapeInterval: 30s
  # Select all ServiceMonitor,PodMonitor in every namespace
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  podMonitorNamespaceSelector: {}
  # Labels for seperation of monitoring
  externalLabels:
    cluster: ${CLUSTER_NAME}
    cluster_type: ephemeral
    team: ${TEAM}
  remoteWrite:
    - url: https://aps-workspaces.${AWS_REGION}.amazonaws.com/workspaces/${AMP_WORKSPACE_ID}/api/v1/remote_write
      sigv4:
        region: ${AWS_REGION}
      queueConfig:
        maxSamplesPerSend: 1000
        maxShards: 200
        capacity: 2500
  # No PVC: the WAL is disposable on an ephemeral cluster.
  resources:
    requests: { cpu: 100m, memory: 256Mi}
    limits: { memory: 512Mi }


